<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Emoji Support Font -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet">
  
<title>Spin the Wheel</title>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               Roboto, Helvetica, Arial,
               "Noto Color Emoji", sans-serif;

  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;

  background: linear-gradient(135deg, #ffdde1, #ee9ca7, #d4a5ff);
  color: #333;
}

#wrapper {
  background: rgba(255,255,255,0.9);
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  max-width: 90%;
}

.wheel-container {
  position: relative;
  width: 260px;
  height: 260px;
  margin: auto;
}

.wheel {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: conic-gradient(
    #ff6f91 0deg 60deg,
    #ff9671 60deg 120deg,
    #ffc75f 120deg 180deg,
    #f9f871 180deg 240deg,
    #845ec2 240deg 300deg,
    #d65db1 300deg 360deg
  );
  transition: transform 4s ease-out;
}

.pointer {
  position: absolute;
  top: -18px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 26px;
}

button {
  margin-top: 25px;
  padding: 10px 30px;
  font-size: 16px;
  border-radius: 25px;
  border: none;
  background: #ff6f91;
  color: white;
  cursor: pointer;
}

#message {
  display: none;
  font-size: 19px;
  animation: fadeIn 1s ease forwards;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}
</style>
</head>

<body>

<div id="wrapper">

<div id="game">
  <h2>&#127756; Spin the Wheel</h2>
  <p>See your luck today…</p>

  <div class="wheel-container">
    <div class="pointer">&#11015;</div>
    <div class="wheel" id="wheel"></div>
  </div>

  <button id="spinBtn">SPIN</button>
</div>

<div id="message">
  &#128140; You have been selected for Mariam's special message today.<br><br>
  Valentine is for friends as well &#129293;<br><br>
  Happy Valentine to my favorite friend!<br>
  Don’t forget to love yourself &#129293
</div>

</div>

<script>
const button = document.getElementById("spinBtn");
const wheel = document.getElementById("wheel");
const game = document.getElementById("game");
const message = document.getElementById("message");

button.addEventListener("click", spin);
button.addEventListener("touchstart", spin);

function spin() {
  button.disabled = true;

  const randomDegree = Math.floor(Math.random() * 360) + 1440;

  wheel.style.transform = "rotate(" + randomDegree + "deg)";

  setTimeout(function() {
    game.style.display = "none";
    message.style.display = "block";
  }, 4200);
}
</script>

</body>
</html>
